name: PR quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-tools:
    name: PR format and report tests (not iOS build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Test report generation and evidence checks
        run: node --test scripts/pr-report.test.mjs
      - name: Check pull request description
        if: github.event_name == 'pull_request'
        run: node scripts/pr-report.mjs --check-pr
